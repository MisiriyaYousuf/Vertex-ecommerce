{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Secure Payment | Vertex</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

</head>

<body>

    <!--
        csrf_token is important.
        It causes Django to provide the CSRF cookie.
    -->
    {% csrf_token %}

    <h2>Complete your payment</h2>

    <p id="payment-message">
        Preparing secure payment...
    </p>

    <button
        type="button"
        id="pay-button"
        disabled
    >
        Preparing Payment...
    </button>


<script>

"use strict";


const createUrl =
    "{% url 'orders:razorpay_create' %}";


const verifyUrl =
    "{% url 'orders:razorpay_verify' %}";


const successUrl =
    "{% url 'orders:order_success' %}";


/* ============================================================
   CSRF
   ============================================================ */

function getCookie(name) {

    let cookieValue = null;

    if (
        document.cookie &&
        document.cookie !== ""
    ) {

        const cookies =
            document.cookie.split(";");

        for (
            let i = 0;
            i < cookies.length;
            i++
        ) {

            const cookie =
                cookies[i].trim();

            if (
                cookie.substring(
                    0,
                    name.length + 1
                ) ===
                name + "="
            ) {

                cookieValue =
                    decodeURIComponent(
                        cookie.substring(
                            name.length + 1
                        )
                    );

                break;
            }
        }
    }

    return cookieValue;
}


/* ============================================================
   UI HELPERS
   ============================================================ */

function setMessage(message) {

    const messageElement =
        document.getElementById(
            "payment-message"
        );

    messageElement.textContent =
        message;
}


function setButton(
    text,
    disabled
) {

    const button =
        document.getElementById(
            "pay-button"
        );

    button.textContent =
        text;

    button.disabled =
        disabled;
}


/* ============================================================
   CREATE RAZORPAY ORDER
   ============================================================ */

async function createRazorpayOrder() {

    setMessage(
        "Preparing secure payment..."
    );

    setButton(
        "Creating Payment...",
        true
    );

    const csrftoken =
        getCookie("csrftoken");

    if (!csrftoken) {

        setMessage(
            "Security token missing. Please refresh the page."
        );

        setButton(
            "Try Again",
            false
        );

        return;
    }


    try {

        const response =
            await fetch(
                createUrl,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "X-CSRFToken":
                            csrftoken,

                        "X-Requested-With":
                            "XMLHttpRequest",
                    },

                    credentials:
                        "same-origin",

                    body:
                        JSON.stringify({})
                }
            );


        /*
         * Do not blindly call response.json().
         * Django may return HTML for a 403/500 error.
         */

        const contentType =
            response.headers.get(
                "content-type"
            ) || "";


        let data;


        if (
            contentType.includes(
                "application/json"
            )
        ) {

            data =
                await response.json();

        } else {

            const text =
                await response.text();

            console.error(
                "Non-JSON response:",
                text
            );

            throw new Error(
                "Server returned an unexpected response. Check Django console."
            );
        }


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to create payment."
            );
        }


        console.log(
            "Razorpay order created:",
            data
        );


        openRazorpayCheckout(
            data
        );

    } catch (error) {

        console.error(
            "Razorpay create error:",
            error
        );

        setMessage(
            error.message ||
            "Unable to start payment."
        );

        setButton(
            "Try Again",
            false
        );
    }
}


/* ============================================================
   OPEN RAZORPAY CHECKOUT
   ============================================================ */

function openRazorpayCheckout(data) {

    if (
        typeof Razorpay ===
        "undefined"
    ) {

        setMessage(
            "Razorpay Checkout failed to load."
        );

        setButton(
            "Try Again",
            false
        );

        return;
    }


    const options = {

        key:
            data.key,

        amount:
            data.amount,

        currency:
            data.currency,

        name:
            data.name,

        description:
            data.description,

        order_id:
            data.razorpay_order_id,


        handler:
            async function(
                response
            ) {

                await verifyPayment(
                    response
                );
            },


        modal: {

            ondismiss:
                function() {

                    setMessage(
                        "Payment cancelled."
                    );

                    setButton(
                        "Pay Again",
                        false
                    );
                }
        },


        theme: {
            color: "#6f42c1"
        }
    };


    console.log(
        "Opening Razorpay:",
        options
    );


    try {

        const razorpay =
            new Razorpay(
                options
            );


        razorpay.on(
            "payment.failed",
            function(response) {

                console.error(
                    "Payment failed:",
                    response
                );

                const description =
                    response?.error?.description;

                setMessage(
                    description ||
                    "Payment failed. Please try again."
                );

                setButton(
                    "Pay Again",
                    false
                );
            }
        );


        razorpay.open();

    } catch (error) {

        console.error(
            "Razorpay open error:",
            error
        );

        setMessage(
            error.message ||
            "Unable to open Razorpay Checkout."
        );

        setButton(
            "Try Again",
            false
        );
    }
}


/* ============================================================
   VERIFY PAYMENT
   ============================================================ */

async function verifyPayment(
    paymentResponse
) {

    setMessage(
        "Verifying payment..."
    );

    setButton(
        "Verifying...",
        true
    );


    const csrftoken =
        getCookie("csrftoken");


    try {

        const response =
            await fetch(
                verifyUrl,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "X-CSRFToken":
                            csrftoken,

                        "X-Requested-With":
                            "XMLHttpRequest",
                    },

                    credentials:
                        "same-origin",

                    body:
                        JSON.stringify({

                            razorpay_payment_id:
                                paymentResponse
                                    .razorpay_payment_id,

                            razorpay_order_id:
                                paymentResponse
                                    .razorpay_order_id,

                            razorpay_signature:
                                paymentResponse
                                    .razorpay_signature
                        })
                }
            );


        const contentType =
            response.headers.get(
                "content-type"
            ) || "";


        let data;


        if (
            contentType.includes(
                "application/json"
            )
        ) {

            data =
                await response.json();

        } else {

            const text =
                await response.text();

            console.error(
                "Verification non-JSON response:",
                text
            );

            throw new Error(
                "Server returned an unexpected response during verification."
            );
        }


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Payment verification failed."
            );
        }


        setMessage(
            "Payment successful. Redirecting..."
        );


        window.location.href =
            data.redirect_url;


    } catch (error) {

        console.error(
            "Payment verification error:",
            error
        );

        setMessage(
            error.message ||
            "Payment verification failed."
        );

        setButton(
            "Try Again",
            false
        );
    }
}


/* ============================================================
   BUTTON
   ============================================================ */

document
    .getElementById(
        "pay-button"
    )
    .addEventListener(
        "click",
        createRazorpayOrder
    );


/* ============================================================
   START PAYMENT AUTOMATICALLY
   ============================================================ */

createRazorpayOrder();

</script>

</body>

</html>
