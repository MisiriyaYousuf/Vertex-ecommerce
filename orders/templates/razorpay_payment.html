{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Secure Payment | Vertex
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #160d2d,
                    #241044,
                    #10091f
                );

            color: #ffffff;
        }


        .payment-container {

            width: min(92%, 500px);

            padding: 40px;

            border-radius: 20px;

            background:
                rgba(255, 255, 255, 0.08);

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(15px);

            text-align: center;
        }


        h1 {

            margin-bottom: 12px;
        }


        p {

            color: #d6d0e5;

            line-height: 1.6;
        }


        .secure-text {

            font-size: 14px;

            margin-top: 20px;
        }


        #payButton {

            width: 100%;

            margin-top: 25px;

            padding: 15px;

            border: none;

            border-radius: 10px;

            background: #ffffff;

            color: #241044;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        #payButton:hover {

            opacity: 0.92;
        }


        #payButton:disabled {

            opacity: 0.6;

            cursor: not-allowed;
        }


        #paymentStatus {

            margin-top: 20px;

            min-height: 24px;

            color: #d6d0e5;
        }


        #paymentError {

            display: none;

            margin-top: 20px;

            padding: 12px;

            border-radius: 8px;

            background:
                rgba(255, 70, 70, 0.12);

            border:
                1px solid
                rgba(255, 100, 100, 0.3);

            color: #ffb4b4;

            text-align: left;

            line-height: 1.5;
        }


        #retryButton {

            display: none;

            width: 100%;

            margin-top: 12px;

            padding: 12px;

            border:
                1px solid
                rgba(255, 255, 255, 0.2);

            border-radius: 10px;

            background: transparent;

            color: white;

            cursor: pointer;
        }


        #retryButton:hover {

            background:
                rgba(255, 255, 255, 0.08);
        }


        .small {

            font-size: 13px;

            color: #aaa0bd;
        }

    </style>

</head>


<body>


<div class="payment-container">

    <h1>
        Secure Payment
    </h1>


    <p>
        You are being redirected to
        Razorpay's secure payment checkout.
    </p>


    <button
        id="payButton"
        type="button"
    >
        Pay with Razorpay
    </button>


    <div id="paymentStatus">
        Ready for secure payment.
    </div>


    <div id="paymentError"></div>


    <button
        id="retryButton"
        type="button"
    >
        Try Payment Again
    </button>


    <p class="secure-text">
        🔒 Secured by Razorpay
    </p>

</div>


<form
    id="csrfForm"
    style="display:none;"
>

    {% csrf_token %}

</form>


<script
    src="https://checkout.razorpay.com/v1/checkout.js"
></script>


<script>

"use strict";


/* ============================================================
   URLS
   ============================================================ */

const createUrl =
    "{% url 'orders:razorpay_create' %}";


const verifyUrl =
    "{% url 'orders:razorpay_verify' %}";


/* ============================================================
   ELEMENTS
   ============================================================ */

const payButton =
    document.getElementById(
        "payButton"
    );


const retryButton =
    document.getElementById(
        "retryButton"
    );


const paymentStatus =
    document.getElementById(
        "paymentStatus"
    );


const paymentError =
    document.getElementById(
        "paymentError"
    );


/* ============================================================
   ERROR HELPERS
   ============================================================ */

function showError(message) {

    paymentError.textContent =
        message;

    paymentError.style.display =
        "block";
}


function hideError() {

    paymentError.textContent =
        "";

    paymentError.style.display =
        "none";
}


/* ============================================================
   STATUS
   ============================================================ */

function setStatus(message) {

    paymentStatus.textContent =
        message;
}


/* ============================================================
   BUTTON STATE
   ============================================================ */

function disablePaymentButton() {

    payButton.disabled = true;

    retryButton.style.display =
        "none";
}


function enablePaymentButton() {

    payButton.disabled = false;

    retryButton.style.display =
        "block";
}


/* ============================================================
   RAZORPAY SDK CHECK
   ============================================================ */

if (
    typeof Razorpay ===
    "undefined"
) {

    console.error(
        "Razorpay Checkout SDK was not loaded."
    );

    setStatus(
        "Payment service could not be loaded."
    );

    showError(
        "Razorpay Checkout could not be loaded. " +
        "Please check your internet connection and try again."
    );

    payButton.disabled = true;
}


/* ============================================================
   CSRF
   ============================================================ */

function getCsrfToken() {

    const input =
        document.querySelector(
            "#csrfForm input[name='csrfmiddlewaretoken']"
        );


    if (!input) {

        throw new Error(
            "CSRF token not found."
        );
    }


    return input.value;
}


/* ============================================================
   CREATE RAZORPAY ORDER
   ============================================================ */

async function createRazorpayOrder() {

    const csrfToken =
        getCsrfToken();


    const response =
        await fetch(
            createUrl,
            {
                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json",

                    "X-CSRFToken":
                        csrfToken,

                    "X-Requested-With":
                        "XMLHttpRequest"
                },

                body:
                    JSON.stringify({})
            }
        );


    let data;


    try {

        data =
            await response.json();

    } catch (error) {

        console.error(
            "Create order JSON error:",
            error
        );

        throw new Error(
            "Invalid response from server."
        );
    }


    console.log(
        "Razorpay create response:",
        data
    );


    if (
        !response.ok ||
        !data.success
    ) {

        throw new Error(
            data.message ||
            "Unable to create Razorpay order."
        );
    }


    return data;
}


/* ============================================================
   VERIFY PAYMENT
   ============================================================ */

async function verifyPayment(
    razorpayResponse
) {

    const csrfToken =
        getCsrfToken();


    const response =
        await fetch(
            verifyUrl,
            {
                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json",

                    "X-CSRFToken":
                        csrfToken,

                    "X-Requested-With":
                        "XMLHttpRequest"
                },

                body:
                    JSON.stringify(
                        razorpayResponse
                    )
            }
        );


    let data;


    try {

        data =
            await response.json();

    } catch (error) {

        console.error(
            "Verify JSON error:",
            error
        );

        throw new Error(
            "Invalid verification response."
        );
    }


    console.log(
        "Razorpay verify response:",
        data
    );


    if (
        !response.ok ||
        !data.success
    ) {

        throw new Error(
            data.message ||
            "Payment verification failed."
        );
    }


    return data;
}


/* ============================================================
   OPEN RAZORPAY CHECKOUT
   ============================================================ */

async function openRazorpayCheckout() {

    hideError();

    disablePaymentButton();


    setStatus(
        "Creating secure payment..."
    );


    try {

        /* ----------------------------------------------------
           CREATE SERVER-SIDE ORDER
           ---------------------------------------------------- */

        const orderData =
            await createRazorpayOrder();


        console.log(
            "Razorpay order data:",
            orderData
        );


        /* ----------------------------------------------------
           ALREADY PAID
           ---------------------------------------------------- */

        if (
            orderData.already_paid &&
            orderData.redirect_url
        ) {

            window.location.href =
                orderData.redirect_url;

            return;
        }


        /* ----------------------------------------------------
           VALIDATE RESPONSE
           ---------------------------------------------------- */

        if (
            !orderData.key ||
            !orderData.razorpay_order_id ||
            !orderData.amount
        ) {

            throw new Error(
                "Incomplete Razorpay order data."
            );
        }


        console.log(
            "Razorpay Key:",
            orderData.key
        );


        console.log(
            "Razorpay Order ID:",
            orderData.razorpay_order_id
        );


        console.log(
            "Amount in paise:",
            orderData.amount
        );


        setStatus(
            "Opening Razorpay..."
        );


        /* ====================================================
           RAZORPAY OPTIONS
           ==================================================== */

        const options = {

            key:
                orderData.key,


            amount:
                orderData.amount,


            currency:
                orderData.currency ||
                "INR",


            name:
                orderData.name ||
                "Vertex",


            description:
                orderData.description ||
                "Vertex Order",


            order_id:
                orderData.razorpay_order_id,


            prefill: {

                name:
                    orderData.prefill?.name ||
                    "",

                email:
                    orderData.prefill?.email ||
                    ""
            },


            theme: {

                color:
                    "#6f42c1"
            },


            /* =================================================
               PAYMENT SUCCESS
               ================================================= */

            handler:
                async function(response) {

                    console.log(
                        "========== RAZORPAY SUCCESS =========="
                    );


                    console.log(
                        "Full success response:",
                        response
                    );


                    console.log(
                        "Payment ID:",
                        response?.razorpay_payment_id
                    );


                    console.log(
                        "Order ID:",
                        response?.razorpay_order_id
                    );


                    console.log(
                        "Signature:",
                        response?.razorpay_signature
                    );


                    console.log(
                        "========================================"
                    );


                    if (
                        !response ||
                        !response.razorpay_payment_id ||
                        !response.razorpay_order_id ||
                        !response.razorpay_signature
                    ) {

                        showError(
                            "Razorpay returned an incomplete payment response."
                        );


                        setStatus(
                            "Payment verification failed."
                        );


                        enablePaymentButton();

                        return;
                    }


                    setStatus(
                        "Payment received. Verifying..."
                    );


                    try {

                        const result =
                            await verifyPayment(
                                response
                            );


                        console.log(
                            "Verification result:",
                            result
                        );


                        if (
                            result.success &&
                            result.redirect_url
                        ) {

                            setStatus(
                                "Payment verified. Redirecting..."
                            );


                            window.location.href =
                                result.redirect_url;

                            return;
                        }


                        throw new Error(
                            result.message ||
                            "Payment verification failed."
                        );

                    } catch (error) {

                        console.error(
                            "Verification error:",
                            error
                        );


                        showError(
                            error.message ||
                            "Payment verification failed."
                        );


                        setStatus(
                            "Payment verification failed."
                        );


                        enablePaymentButton();
                    }
                },


            /* =================================================
               MODAL CLOSE
               ================================================= */

            modal: {

                ondismiss:
                    function() {

                        console.log(
                            "Razorpay checkout closed."
                        );


                        setStatus(
                            "Payment window closed."
                        );


                        showError(
                            "Payment was not completed. " +
                            "You can try again."
                        );


                        enablePaymentButton();
                    }
            }
        };


        /* ====================================================
           CREATE RAZORPAY INSTANCE
           ==================================================== */

        const razorpay =
            new Razorpay(options);


            /* ====================================================
                PAYMENT FAILED
                ==================================================== */

                razorpay.on(
                    "payment.failed",
                    function(response) {

                        console.error(
                            "========== RAZORPAY PAYMENT FAILED =========="
                        );

                        console.error(
                            "Full response:",
                            response
                        );

                        console.error(
                            "Error object:",
                            response?.error
                        );

                        console.error(
                            "Error code:",
                            response?.error?.code
                        );

                        console.error(
                            "Description:",
                            response?.error?.description
                        );

                        console.error(
                            "Source:",
                            response?.error?.source
                        );

                        console.error(
                            "Step:",
                            response?.error?.step
                        );

                        console.error(
                            "Reason:",
                            response?.error?.reason
                        );

                        console.error(
                            "Metadata:",
                            response?.error?.metadata
                        );

                        console.error(
                            "=============================================="
                        );
                        window.location.href =
                            "{% url 'orders:order_failure' %}";
                    }
                );

        /* ====================================================
           OPEN CHECKOUT
           ==================================================== */

        console.log(
            "Opening Razorpay Checkout..."
        );


        razorpay.open();


    } catch (error) {

        console.error(
            "Checkout error:",
            error
        );


        showError(
            error.message ||
            "Unable to start payment."
        );


        setStatus(
            "Unable to start payment."
        );


        enablePaymentButton();
    }
}


/* ============================================================
   BUTTON EVENTS
   ============================================================ */

payButton.addEventListener(
    "click",
    function() {

        openRazorpayCheckout();

    }
);


retryButton.addEventListener(
    "click",
    function() {

        openRazorpayCheckout();

    }
);

</script>


</body>

</html>
