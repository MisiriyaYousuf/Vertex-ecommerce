{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>

<link rel="stylesheet" href="{% static 'css/signin.css' %}">

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Roboto, Helvetica, Arial, sans-serif;
        background: #f4f7f9;
        color: #1f2933;
    }

    .login-container {
        width: 100%;
        height: 100vh;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 15px 20px;
    }

    .login-card {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        padding: 30px 34px 25px;
        border-radius: 16px;
        box-shadow: 0 10px 35px rgba(26, 60, 84, 0.12);
        border: 1px solid #e7edf1;
    }

    .login-title {
        text-align: center;
        margin-bottom: 9px;
    }

    .login-title h2 {
        margin: 0;
        color: #1a3c54;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.3px;
    }

    .login-description {
        text-align: center;
        margin: 0 0 22px;
        color: #7a8791;
        font-size: 13px;
        line-height: 1.5;
    }

    .alert {
        padding: 8px 12px;
        margin-bottom: 16px;
        border-radius: 7px;
        font-size: 13px;
        text-align: center;
        opacity: 1;
        transition: opacity 2s ease;
    }

    .alert.fade-out {
        opacity: 0;
    }

    .alert.success {
        background: #e9f7ef;
        color: #176b3a;
        border: 1px solid #c8ead6;
    }

    .alert.error {
        background: #fff0f0;
        color: #b42318;
        border: 1px solid #f3c6c3;
    }

    .alert.warning {
        background: #fff8e6;
        color: #8a5a00;
        border: 1px solid #f0dda5;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        color: #344854;
        font-size: 13px;
        font-weight: 600;
    }

    .form-group input {
        width: 100%;
        height: 44px;
        padding: 0 13px;
        border: 1px solid #d5dde3;
        border-radius: 7px;
        background: #ffffff;
        color: #26343d;
        font-size: 13px;
        outline: none;
        transition: border-color 0.2s ease,
                    box-shadow 0.2s ease;
    }

    .form-group input::placeholder {
        color: #a1abb2;
    }

    .form-group input:focus {
        border-color: #1a3c54;
        box-shadow: 0 0 0 3px rgba(26, 60, 84, 0.10);
    }

    .submit-btn {
        width: 100%;
        height: 44px;
        border: none;
        border-radius: 7px;
        background: #1a3c54;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease,
                    transform 0.15s ease,
                    box-shadow 0.2s ease;
    }

    .submit-btn:hover {
        background: #143246;
        box-shadow: 0 5px 14px rgba(26, 60, 84, 0.20);
    }

    .submit-btn:active {
        transform: translateY(1px);
    }

    .signup-text {
        margin: 19px 0 0;
        text-align: center;
        color: #7a8791;
        font-size: 12px;
    }

    .signup-text a {
        color: #2b4d66;
        text-decoration: none;
        font-weight: 700;
        margin-left: 3px;
    }

    .signup-text a:hover {
        color: #0b1a24;
        text-decoration: none;
    }

    @media (max-height: 600px) {

        .login-container {
            padding: 8px 15px;
        }

        .login-card {
            padding: 22px 30px 18px;
        }

        .login-title h2 {
            font-size: 23px;
        }

        .login-description {
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .signup-text {
            margin-top: 12px;
        }
    }

    @media (max-width: 480px) {

        .login-container {
            padding: 10px 14px;
        }

        .login-card {
            max-width: 400px;
            padding: 26px 22px 21px;
            border-radius: 14px;
        }

        .login-title h2 {
            font-size: 24px;
        }

        .login-description {
            font-size: 12px;
        }

        .form-group input,
        .submit-btn {
            height: 43px;
        }
    }
</style>

</head>

<body>

<div class="login-container">

<div class="login-card">

    <div class="login-title">
        <h2>Forgot Password?</h2>
    </div>

    <br>

    {% if messages %}
        {% for message in messages %}
            <div class="alert {{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email address"
                autocomplete="off"
                required
            >

        </div>

        <button type="submit" class="submit-btn">
            Send OTP
        </button>

    </form>

    <p class="signup-text">

        Remember your password?

        <a href="{% url 'users:signin' %}"
           onclick="window.location.replace(this.href); return false;">
            Sign In
        </a>

    </p>

</div>


</div>

</body>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const alerts = document.querySelectorAll(".alert");

        alerts.forEach(function (alert) {
            setTimeout(function () {
                alert.classList.add("fade-out");

                setTimeout(function () {
                    alert.remove();
                }, 500);

            }, 2000);
        });
    });
</script>
</html>
