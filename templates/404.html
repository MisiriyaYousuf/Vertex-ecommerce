{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Page Not Found | Vertex</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f2f7;
        font-family: 'Roboto', sans-serif;
        color: #2d1b3d;
    }

    .error-page {
        width: 92%;
        max-width: 550px;
        text-align: center;
    }

    .error-card {
        background: #ffffff;
        border-radius: 16px;
        padding: 50px 35px;
        box-shadow: 0 10px 35px rgba(61, 31, 84, 0.10);
        border: 1px solid #e8dfec;
    }

    .error-icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;

        background: #f5f0f8;
        color: #582e79;

        font-size: 32px;
        font-weight: 800;
    }

    .error-code {
        font-size: 64px;
        font-weight: 800;
        line-height: 1;
        color: #582e79;
        margin-bottom: 12px;
    }

    .error-title {
        font-size: 24px;
        font-weight: 700;
        color: #2d1b3d;
        margin-bottom: 10px;
    }

    .error-message {
        color: #777080;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 25px;
    }

    .home-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        padding: 11px 22px;

        border-radius: 8px;

        background: #582e79;
        color: #ffffff;

        text-decoration: none;

        font-size: 13px;
        font-weight: 600;

        transition: 0.2s ease;
    }

    .home-btn:hover {
        background: #3d1f54;
        color: #ffffff;
        transform: translateY(-1px);
    }

    .back-btn {
        display: inline-block;
        margin-left: 8px;

        padding: 10px 18px;

        border-radius: 8px;

        border: 1px solid #d9cde0;

        color: #582e79;

        text-decoration: none;

        font-size: 13px;
        font-weight: 600;

        transition: 0.2s ease;
    }

    .back-btn:hover {
        background: #f5f0f8;
        color: #3d1f54;
    }

    .brand {
        margin-top: 20px;
        color: #8b7a94;
        font-size: 12px;
    }

    @media (max-width: 576px) {

        .error-card {
            padding: 40px 22px;
        }

        .error-code {
            font-size: 52px;
        }

        .error-title {
            font-size: 20px;
        }

        .home-btn,
        .back-btn {
            width: 100%;
            margin: 5px 0;
        }

    }

</style>


</head>

<body>


<div class="error-page">

    <div class="error-card">

        <div class="error-icon">
            !
        </div>

        <div class="error-code">
            404
        </div>

        <h1 class="error-title">
            Page Not Found
        </h1>

        <p class="error-message">
            Sorry, the page you are looking for doesn't exist
            or entere an incorrect URL.
        </p>

       {% if user.is_authenticated %}

    <a
        href="{% url 'users:home' %}"
        class="home-btn">

        Go to Home

    </a>

{% else %}

    <a
        href="{% url 'users:signin' %}"
        class="home-btn">

        Go to Login

    </a>

{% endif %}


    </div>

    <div class="brand">
        © {% now "Y" %} Vertex. All Rights Reserved.
    </div>

</div>


</body>

</html>
